# The garage on the VPS (docs/adr/0002, docs/BETRIEB.md). One stack per
# environment, each in its own directory under /opt/containers, so Compose
# namespaces the containers by directory and the environments never collide.
#
# The image comes from GHCR, built by .github/workflows/ci.yml; nothing is
# built on the server. IMAGE_TAG selects the immutable tag to run, HOST_PORT
# the loopback port Nginx proxies to. Both are set by deploy/deploy-remote.sh.
# The container binds to loopback only: Nginx is the sole public entry point.

services:
  web:
    image: ghcr.io/spockey4711/portfolio-garage:${IMAGE_TAG:?set by deploy-remote.sh}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:?set by deploy-remote.sh}:3000"
    environment:
      - NODE_ENV=production
    # The Strava keys (docs/BETRIEB.md, "Strava") live on the server only,
    # mode 600. Optional so a stack without them still comes up; the Strava
    # routes then answer with an error, the rest of the site works.
    env_file:
      - path: .env
        required: false
    # Strava token and activity cache, the only state the app keeps
    # (docs/adr/0002). Survives deploys, is never in the image.
    volumes:
      - data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
