# Runs the quality gate on every pull request and on every push to the
# long-lived branches. A green gate on develop then builds the image, pushes
# it to GHCR and deploys it to the develop preview on the VPS (docs/BETRIEB.md).
# The gate itself needs no secrets: the build has no data source yet. It does
# need network access for the Google Fonts fetch.
name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Every PR builds the image so a broken Dockerfile fails before the merge;
      # only a push to develop logs in and publishes it.
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One immutable tag per commit for deploy and rollback, plus a moving
      # branch tag for whoever wants "the current develop".
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The footer names the commit it was built from (docs/KONZEPT.md §10);
      # the image build has no .git, so the SHA goes in as a build arg.
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-develop:
    name: Deploy develop
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: develop
      url: https://garage.yannikwuenker.de
    # Two deploys of the same environment must not interleave.
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    env:
      DEPLOY: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      STACK_DIR: /opt/containers/garage
    steps:
      - uses: actions/checkout@v7

      # The private key is a repository secret; the host key is pinned through
      # a repository variable so a changed server identity fails loudly.
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy stack files
        run: scp compose.yaml deploy/deploy-remote.sh "$DEPLOY:$STACK_DIR/"

      - name: Deploy
        run: |
          ssh "$DEPLOY" "cd $STACK_DIR && IMAGE_TAG='${{ needs.image.outputs.tag }}' HOST_PORT=3010 ./deploy-remote.sh"
